# Telemetry test stack: MinIO (fake S3) + OTEL Collector.
# Started/stopped by global-setup.ts / global-teardown.ts.
#
# MinIO comes from Chainguard's registry, which serves it to an anonymous pull; MinIO's
# own quay.io repositories and Docker Hub refuse one. The image is distroless, with no
# shell to run `mc` in, so global-setup.ts creates the bucket over the S3 API.

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
    # A named volume rather than the container layer, where MinIO cannot rename its own
    # directories and logs a storage error at every start. `down -v` removes it.
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.149.0
    depends_on:
      - minio
    ports:
      - "4318:4318"
    volumes:
      - ./otelcol-config.e2e.yaml:/etc/otelcol-contrib/config.yaml
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin

volumes:
  minio-data: {}
