name: GUI Build

on:
  pull_request:
    paths:
      - 'gui/**'
      - '.github/workflows/gui-build.yml'
  push:
    branches: [main]
    paths:
      - 'gui/**'
      - '.github/workflows/gui-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build desktop app (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      # Tauri's Linux build links against the system WebKitGTK/GTK stack.
      # See https://tauri.app/start/prerequisites/.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: gui/src-tauri

      - name: Install dependencies
        run: npm ci

      # Builds the frontend into gui/dist, which the Rust shell embeds at
      # compile time via tauri::generate_context!().
      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
