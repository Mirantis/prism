name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so commitlint can see the range it needs to lint.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

      - name: Lint
        run: npm run lint

      - name: Lint commits
        # Run the repo's own pinned commitlint (@commitlint/cli@^21, installed
        # by `npm ci` above) rather than a Docker action, so the version that
        # lints in CI is exactly the one pinned here — no bundled-version skew.
        # For pull_request we lint the PR's own commits using explicit base/head
        # SHAs (base.sha..head.sha), which ignores the default merge commit
        # GitHub checks out and never reaches unrelated base-branch history.
        # For push we lint the pushed range (before..sha), skipping the case
        # where before is the all-zeroes SHA (a brand-new branch has no range).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --config commitlint.config.mjs --verbose \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch push (no prior commit); skipping commit range lint."
          else
            npx commitlint --config commitlint.config.mjs --verbose \
              --from "${{ github.event.before }}" \
              --to "${{ github.sha }}"
          fi

  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # clippy builds the crate, and its output differs from a test build's, so the
      # job keeps a cache of its own.
      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
            cli/target
          key: lint-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock', 'cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            lint-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock', 'cli/Cargo.lock') }}-

      - name: Check formatting
        run: |
          cargo fmt --manifest-path backend/Cargo.toml --check
          cargo fmt --manifest-path cli/Cargo.toml --check

      - name: Lint
        run: |
          cargo clippy --manifest-path backend/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path cli/Cargo.toml --locked --all-targets -- -D warnings

      - if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
            cli/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
