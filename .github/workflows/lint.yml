name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so commitlint can see the range it needs to lint.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Markdown
        run: npm run lint:md

      - name: Lint
        run: npm run lint

      - name: Lint commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          # Must point at the .mjs config: the action rejects a .js configFile
          # and otherwise silently falls back to bare config-conventional,
          # skipping our signed-off-by rule and Copilot ignore.
          configFile: commitlint.config.mjs
