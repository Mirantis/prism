name: Create Binary

# Build the distributable `prism` (terminal UI) and `prism-server` (runtime)
# Node SEA binaries for macOS, Linux and Windows on every PR + push to main,
# smoke-test them, and upload them as workflow artifacts (so they're
# downloadable from the Actions run). Running on PRs catches SEA/native-dep
# breakage before merge. `release-deploy.yml` runs the same pipeline at
# release time and attaches archives to each GitHub Release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build at. Defaults to the event ref.
        type: string
        required: false
      version:
        description: Version string used in archive filenames (e.g. v2026.5.28…).
        type: string
        required: false
        default: dev

permissions:
  contents: read
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Single source of truth for the build pipeline (bundle, SEA inject,
      # collect-natives, smoke, archive) — same script the developer runs
      # locally with `npm run build:binaries`.
      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: npm run build:binaries

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-${{ matrix.os }}
          path: |
            prism-*.tar.gz
            prism-*.zip
          if-no-files-found: error
