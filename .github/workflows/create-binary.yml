name: Create Binary

# Build the distributable `prism` (the terminal UI) and `prism-server` (the
# runtime) Rust binaries for macOS, Linux and Windows on every PR + push to
# main, smoke-test them, and upload them as workflow artifacts (so they're
# downloadable from the Actions run). Running on PRs catches packaging breakage
# before merge. `release-production.yml` runs the same pipeline at
# release time and attaches archives to each GitHub Release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build at. Defaults to the event ref.
        type: string
        required: false
      version:
        description: Version string used in archive filenames (e.g. v2026.5.28…).
        type: string
        required: false
        default: dev

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `name` feeds the artifact name; the first three match the old
        # `matrix.os` values so existing artifact consumers see no change.
        # linux-arm64 runs on GitHub's arm64 hosted runner — the build
        # scripts key off process.platform/process.arch and produce the
        # prism-*-linux-arm64 archive natively.
        include:
          - name: macos-latest
            runner: macos-latest
          - name: ubuntu-latest
            runner: ubuntu-latest
          - name: windows-latest
            runner: windows-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || '' }}

      # Node builds the web bundle; neither binary embeds it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - run: npm install -g npm@11.12.1
      - run: npm ci

      # Both binaries are Rust; rust-toolchain.toml names the toolchain, which
      # rustup on the runner installs on first use.
      - name: Install the Rust toolchain
        shell: bash
        run: rustup show active-toolchain

      # Single source of truth for the build pipeline (web bundle, the two
      # binaries, smoke, archive) — same script the developer runs
      # locally with `npm run build:binaries`.
      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ inputs.version || 'dev' }}
        run: npm run build:binaries

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prism-${{ matrix.name }}
          path: |
            prism-*.tar.gz
            prism-*.zip
            prism-*.sha256
          if-no-files-found: error
