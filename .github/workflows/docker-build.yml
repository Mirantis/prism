name: Docker Build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'web/**'
      - 'cli/**'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'start.sh'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  build-prism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: |
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > .npmrc-secret
          # Authenticate mise/aqua's GitHub API calls so tool installs don't
          # hit the unauthenticated 403 rate limit (see Dockerfile mise step).
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > .gh-token-secret
          docker build \
            --secret id=npmrc,src=.npmrc-secret \
            --secret id=github_token,src=.gh-token-secret \
            -f Dockerfile \
            .
          rm -f .npmrc-secret .gh-token-secret
