name: Docker Build

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'web/**'
      - 'cli/**'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'start.sh'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  build-prism:
    # Native runner per platform — published images are multi-arch
    # (linux/amd64 + linux/arm64), so PRs validate both to catch
    # arch-specific breakage (native module rebuilds, mise tool installs)
    # before merge.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare build secrets
        run: |
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/.npmrc-secret"
          # Authenticate mise/aqua's GitHub API calls so tool installs don't
          # hit the unauthenticated 403 rate limit (see Dockerfile mise step).
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/.gh-token-secret"

      - name: Build Docker image
        run: |
          docker build \
            --secret id=npmrc,src="$RUNNER_TEMP/.npmrc-secret" \
            --secret id=github_token,src="$RUNNER_TEMP/.gh-token-secret" \
            -f Dockerfile \
            .

      - if: always()
        run: rm -f "$RUNNER_TEMP/.npmrc-secret" "$RUNNER_TEMP/.gh-token-secret"
