name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run workspace tests
        run: npm run test:run --workspaces --if-present

      - name: Build the package
        run: npm run build

  runtime:
    name: runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: test-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'runtime/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            test-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'runtime/Cargo.lock') }}-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path runtime/Cargo.toml --check

      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path runtime/Cargo.toml --locked --all-targets -- -D warnings

      # The Prisma CLI interop tests run `prisma migrate deploy` against what the
      # runtime's migrator wrote, so Node and the workspace's packages are here too.
      - if: runner.os != 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - if: runner.os != 'Windows'
        run: npm install -g npm@11.12.1 && npm ci

      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path runtime/Cargo.toml --locked

      # Windows ships the standalone binary; the tests lean on Unix tools, so this
      # checks that every target builds there.
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo check --manifest-path runtime/Cargo.toml --locked --all-targets

      - if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
