name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Run workspace tests
        run: npm run test:run --workspaces --if-present

      - name: Build the web UI
        run: npm run build:web

  # The terminal UI ships on every platform the release builds, so its tests run on each.
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: test-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'cli/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            test-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'cli/Cargo.lock') }}-

      - name: Run tests
        run: cargo test --manifest-path cli/Cargo.toml --locked

      - if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: test-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            test-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock') }}-

      # The Prisma CLI interop tests run `prisma migrate deploy` against what the
      # runtime's migrator wrote, so Node and the workspace's packages are here too.
      - if: runner.os != 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - if: runner.os != 'Windows'
        run: npm install -g npm@11.12.1 && npm ci

      - name: Run tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path backend/Cargo.toml --locked --all-features

      # Windows ships the standalone binary; the tests lean on Unix tools, so this
      # checks that every target builds there.
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo check --manifest-path backend/Cargo.toml --locked --all-targets

      - name: Run path tests on Windows
        if: runner.os == 'Windows'
        run: cargo test --manifest-path backend/Cargo.toml --locked --lib -- support::path tools::shell::workspace

      - if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
