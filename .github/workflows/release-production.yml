name: Release Production

# Manual production build + push, gated by an environment approval.

on:
  workflow_dispatch:

permissions:
  contents: write # for `gh release create` (creates and pushes the tag)
  packages: write # for ghcr.io push

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
    steps:
      - name: Generate version and resolve release SHA marker
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Time-based version: vYYYY.M.DDHHMMSS (UTC). Seconds prevent
          # collisions between runs that land in the same minute.
          VERSION="v$(TZ=UTC date +'%Y.%-m.%-d%H%M%S')"
          RELEASE_SHA=$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"
          echo "Release SHA marker (main HEAD): $RELEASE_SHA"

  approve:
    needs: prepare
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved release ${{ needs.prepare.outputs.version }}"

  # Build per-platform images on native runners (no QEMU emulation) and
  # push each by digest; the merge job below stitches them into one
  # multi-arch manifest. Pattern mirrors the upstream Lens Agents deploy.yml.
  build:
    needs: [prepare, approve]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Prepare build secrets
        env:
          OTEL_EXPORTER_OTLP_API_KEY: ${{ secrets.OTEL_EXPORTER_OTLP_API_KEY }}
        run: |
          set -euo pipefail
          # Authenticate mise/aqua's GitHub API calls (avoids the 403 rate limit).
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/.gh-token-secret"
          printf '%s' "$OTEL_EXPORTER_OTLP_API_KEY" > "$RUNNER_TEMP/.otel-api-key-secret"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/lensapp/prism-agent,push-by-digest=true,name-canonical=true,push=true
          secret-files: |
            github_token=${{ runner.temp }}/.gh-token-secret
            otel_api_key=${{ runner.temp }}/.otel-api-key-secret
          build-args: |
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
            DEPLOYMENT_ENVIRONMENT=production
            SERVICE_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-prism-${{ matrix.platform }}
          cache-to: type=gha,scope=release-prism-${{ matrix.platform }},mode=max

      - if: always()
        run: rm -f "$RUNNER_TEMP/.gh-token-secret" "$RUNNER_TEMP/.otel-api-key-secret"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-prism-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-platform images into one multi-arch manifest list and
  # apply the version + commit-SHA + latest tags.
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: release-prism-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Create and push manifest
        env:
          GHCR_REPO: ghcr.io/lensapp/prism-agent
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            -t "$GHCR_REPO:$VERSION" \
            -t "$GHCR_REPO:$IMAGE_TAG" \
            -t "$GHCR_REPO:latest" \
            $(printf "$GHCR_REPO@sha256:%s " *)

  # Reuse the create-binary workflow so the build pipeline (matrix, smoke,
  # archive packaging, upload) lives in one place. Builds at release_sha so
  # the archives match the Docker image's commit.
  build-binaries:
    needs: [prepare, approve]
    uses: ./.github/workflows/create-binary.yml
    with:
      ref: ${{ needs.prepare.outputs.release_sha }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish-release:
    needs: [prepare, merge, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Flattens the per-platform binary artifacts into one dir for the
          # gh release glob. The pattern excludes the Docker digest
          # artifacts the build job uploads for the manifest merge.
          pattern: prism-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Prepend the deployed image identity to GitHub's auto-generated
          # release notes so the release page documents exactly what shipped.
          GENERATED=$(gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$VERSION" \
            -f target_commitish="$RELEASE_SHA" \
            --jq '.body')

          # printf rather than heredoc so backticks stay literal.
          {
            printf '## Deployed image\n\n'
            printf -- '- prism-agent: `%s`\n' "$BUILD_SHA"
            printf '\n---\n\n%s\n' "$GENERATED"
          } > /tmp/release-notes.md

          gh release create "$VERSION" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            artifacts/*
