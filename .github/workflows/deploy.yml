name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'web/**'
      - 'cli/**'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'start.sh'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # for ghcr.io push

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          GHCR_REPO: ghcr.io/lensapp/prism-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > .npmrc-secret
          docker build \
            --secret id=npmrc,src=.npmrc-secret \
            -t $GHCR_REPO:canary \
            -t $GHCR_REPO:$IMAGE_TAG \
            -f Dockerfile \
            .
          rm -f .npmrc-secret
          docker push $GHCR_REPO:canary
          docker push $GHCR_REPO:$IMAGE_TAG
