name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'web/**'
      - 'cli/**'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'start.sh'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGING }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > .npmrc-secret
          docker build \
            --secret id=npmrc,src=.npmrc-secret \
            -t $ECR_REGISTRY/lens-platform/prism-agent:$IMAGE_TAG \
            -t $ECR_REGISTRY/lens-platform/prism-agent:latest \
            -f Dockerfile \
            .
          rm -f .npmrc-secret
          docker push $ECR_REGISTRY/lens-platform/prism-agent:$IMAGE_TAG
          docker push $ECR_REGISTRY/lens-platform/prism-agent:latest
