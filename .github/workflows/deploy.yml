name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'web/**'
      - 'cli/**'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'start.sh'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # for ghcr.io push

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          GHCR_REPO: ghcr.io/lensapp/prism-agent
          IMAGE_TAG: ${{ github.sha }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_API_KEY: ${{ secrets.OTEL_EXPORTER_OTLP_API_KEY }}
        run: |
          set -euo pipefail
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > .npmrc-secret
          # Authenticate mise/aqua's GitHub API calls (avoids the 403 rate limit).
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > .gh-token-secret
          printf '%s' "$OTEL_EXPORTER_OTLP_API_KEY" > .otel-api-key-secret
          docker build \
            --secret id=npmrc,src=.npmrc-secret \
            --secret id=github_token,src=.gh-token-secret \
            --secret id=otel_api_key,src=.otel-api-key-secret \
            --build-arg OTEL_EXPORTER_OTLP_ENDPOINT="$OTEL_EXPORTER_OTLP_ENDPOINT" \
            --build-arg DEPLOYMENT_ENVIRONMENT=production \
            -t $GHCR_REPO:canary \
            -t $GHCR_REPO:$IMAGE_TAG \
            -f Dockerfile \
            .
          rm -f .npmrc-secret .gh-token-secret .otel-api-key-secret
          docker push $GHCR_REPO:canary
          docker push $GHCR_REPO:$IMAGE_TAG
