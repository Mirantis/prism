name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'web/**'
      - 'cli/**'
      - 'prisma/**'
      - 'tsconfig.json'
      - 'start.sh'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # for ghcr.io push

jobs:
  # Build per-platform images on native runners (no QEMU emulation) and
  # push each by digest; the merge job below stitches them into one
  # multi-arch manifest. Pattern mirrors nexus-monorepo's deploy.yml.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Prepare build secrets
        env:
          OTEL_EXPORTER_OTLP_API_KEY: ${{ secrets.OTEL_EXPORTER_OTLP_API_KEY }}
        run: |
          set -euo pipefail
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/.npmrc-secret"
          # Authenticate mise/aqua's GitHub API calls (avoids the 403 rate limit).
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/.gh-token-secret"
          printf '%s' "$OTEL_EXPORTER_OTLP_API_KEY" > "$RUNNER_TEMP/.otel-api-key-secret"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/lensapp/prism-agent,push-by-digest=true,name-canonical=true,push=true
          secret-files: |
            npmrc=${{ runner.temp }}/.npmrc-secret
            github_token=${{ runner.temp }}/.gh-token-secret
            otel_api_key=${{ runner.temp }}/.otel-api-key-secret
          build-args: |
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
            DEPLOYMENT_ENVIRONMENT=production
          cache-from: type=gha,scope=deploy-prism-${{ matrix.platform }}
          cache-to: type=gha,scope=deploy-prism-${{ matrix.platform }},mode=max

      - if: always()
        run: rm -f "$RUNNER_TEMP/.npmrc-secret" "$RUNNER_TEMP/.gh-token-secret" "$RUNNER_TEMP/.otel-api-key-secret"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-prism-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge the per-platform images into one multi-arch manifest list and
  # apply the canary + commit-SHA tags.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: deploy-prism-digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Create and push manifest
        env:
          GHCR_REPO: ghcr.io/lensapp/prism-agent
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          docker buildx imagetools create \
            -t "$GHCR_REPO:canary" \
            -t "$GHCR_REPO:$IMAGE_TAG" \
            $(printf "$GHCR_REPO@sha256:%s " *)
