name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_BEDROCK_ROLE_ARN }}
          aws-region: us-east-1

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm run test --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1
          # Slack E2E — @slack tests skip gracefully if these aren't set
          SLACK_CLIENT_ID: ${{ secrets.SLACK_E2E_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_E2E_CLIENT_SECRET }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_E2E_APP_TOKEN }}
          SLACK_E2E_BOT_TOKEN: ${{ secrets.SLACK_E2E_BOT_TOKEN }}
          SLACK_E2E_USER_TOKEN: ${{ secrets.SLACK_E2E_USER_TOKEN }}
          SLACK_E2E_BOT_USER_ID: ${{ secrets.SLACK_E2E_BOT_USER_ID }}
          SLACK_E2E_TEAM_ID: ${{ secrets.SLACK_E2E_TEAM_ID }}
          SLACK_E2E_TEAM_NAME: ${{ secrets.SLACK_E2E_TEAM_NAME }}

      - name: Run TUI E2E tests
        run: npm run test:e2e:tui --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
