name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.exec'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.exec'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

# Keyed on the PR number rather than just `github.ref`: a `pull_request` run's
# ref is the merge ref, so ref-only keying groups and ungroups surprisingly
# across event types.
#
# Per-PR, so two PRs run their e2e concurrently. `e2e-slack` adds a repo-wide
# group of its own for the one thing that cannot overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are superseded: a newer push makes the older run's verdict
  # irrelevant. Pushes to main are never cancelled — a post-merge red on main
  # is the signal we most need, and cancelling it would hide it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Sized to catch a hang, not to stop a slow green run. A green run measured
    # 26m52s and 30m04s on 2026-09-24: about 5.5 min of setup, 19 min of web
    # scenarios and 5.5 min of TUI tests. Re-measure when a suite grows.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install coding agents
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      # The agent's computer is a desktop the runtime builds for itself, so the runner
      # needs what the container image installs for it. Without these the Computer page
      # is not offered at all and its scenario cannot run.
      - name: Install the desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb pulseaudio pulseaudio-utils \
            xfce4 xfce4-terminal dbus-x11 \
            ffmpeg xdotool wmctrl x11-xserver-utils tesseract-ocr

      # No SLACK_* env, and `--grep-invert @slack` so a token added here later
      # still cannot make those scenarios run. They belong to `e2e-slack`.
      - name: Run E2E tests
        run: npm run test:e2e:web --workspace=prism-agent-e2e
        env:
          CI: true
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: Run TUI E2E tests
        # The two suites are independent, and a red Playwright step used to
        # skip this one — throwing away every TUI result for that run, which
        # is where most of the failures actually are. A later step running
        # does not mask the earlier failure: the job still ends up red.
        if: ${{ !cancelled() }}
        run: npm run test:e2e:tui --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          # Playwright's traces/screenshots/videos + its JSON report, and the
          # TUI suite's JUnit report (a separate dir: Playwright wipes its own
          # outputDir when it starts, and it starts first).
          path: |
            e2e/test-results/
            e2e/tui-test-results/
          retention-days: 7

  # The one scenario that wants the agent's commands in a container. Its own
  # job because the runtime settles on one environment at boot: running it
  # beside the others would mean two different tests under one name.
  e2e-docker:
    runs-on: ubuntu-latest
    # One scenario and one LLM turn, behind an image build that is usually a
    # cache hit. Sized for a cold cache, where the build is most of it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Prepare build secrets
        run: |
          # Same reason as the published build: mise/aqua resolve tool releases
          # through the GitHub API, which is rate-limited per runner IP.
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/.gh-token-secret"

      # Built here and loaded into the runner's engine under a tag used by
      # nothing else, and the runtime under test is given that tag as its
      # version. A version tag is not refreshed on boot, so the scenario runs
      # against this PR's image and not whatever `latest` holds. Reuses the
      # layer cache the publishing build fills.
      - name: Build the exec image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile.exec
          load: true
          tags: ghcr.io/lensapp/prism-agent-exec:e2e-${{ github.sha }}
          secret-files: |
            github_token=${{ runner.temp }}/.gh-token-secret
          cache-from: |
            type=gha,scope=pr-exec-linux/amd64
            type=gha,scope=release-exec-linux/amd64

      - if: always()
        run: rm -f "$RUNNER_TEMP/.gh-token-secret"

      - name: Run the container-mode E2E scenario
        run: npm run test:e2e:docker --workspace=prism-agent-e2e
        env:
          CI: true
          EXECUTION_ENVIRONMENT: docker
          SERVICE_VERSION: e2e-${{ github.sha }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-docker
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7

  # Every Slack-touching e2e test, serialized repo-wide: two of these running at
  # once share one Slack app and steal each other's events.
  e2e-slack:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # `queue: max` makes waiters line up instead of cancelling each other, which
    # is what a shared Slack app needs: only one of these may hold the token.
    concurrency:
      group: e2e-slack
      queue: max

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install the desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb pulseaudio pulseaudio-utils \
            xfce4 xfce4-terminal dbus-x11 \
            ffmpeg xdotool wmctrl x11-xserver-utils tesseract-ocr

      # The TUI spec runs first because its runtime closes its websocket on
      # SIGTERM, while Playwright kills its webServer and leaves a socket Slack
      # keeps routing to. Only one connection may be live at a time.
      - name: Run Slack TUI E2E tests
        run: npm run test:e2e:slack:tui --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # Under the SLACK_E2E_* names rather than SLACK_BOT_TOKEN, except for
          # SLACK_APP_TOKEN: `setupRuntime` spreads process.env into every
          # runtime it boots, and the deployed names would put every runtime on
          # Socket Mode. The spec passes the two it needs through explicitly.
          SLACK_APP_TOKEN: ${{ secrets.SLACK_E2E_APP_TOKEN }}
          SLACK_E2E_BOT_TOKEN: ${{ secrets.SLACK_E2E_BOT_TOKEN }}
          SLACK_E2E_USER_TOKEN: ${{ secrets.SLACK_E2E_USER_TOKEN }}
          SLACK_E2E_BOT_USER_ID: ${{ secrets.SLACK_E2E_BOT_USER_ID }}
          SLACK_E2E_TEAM_ID: ${{ secrets.SLACK_E2E_TEAM_ID }}

      # `!cancelled()` so a red TUI step still reports the browser scenarios.
      - name: Run Slack web E2E tests
        if: ${{ !cancelled() }}
        run: npm run test:e2e:slack:web --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # playwright.config.ts maps SLACK_E2E_BOT_TOKEN onto SLACK_BOT_TOKEN
          # for the webServer it spawns, so the runtime reaches Slack through
          # the same tokens the test process uses.
          SLACK_APP_TOKEN: ${{ secrets.SLACK_E2E_APP_TOKEN }}
          SLACK_E2E_BOT_TOKEN: ${{ secrets.SLACK_E2E_BOT_TOKEN }}
          SLACK_E2E_USER_TOKEN: ${{ secrets.SLACK_E2E_USER_TOKEN }}
          SLACK_E2E_BOT_USER_ID: ${{ secrets.SLACK_E2E_BOT_USER_ID }}
          SLACK_E2E_TEAM_ID: ${{ secrets.SLACK_E2E_TEAM_ID }}
          # Required by the `@slack` skip guard. The runtime also checks the bot
          # token's app_id against it, so a wrong value fails the boot.
          SLACK_E2E_EXPECTED_APP_ID: ${{ secrets.SLACK_E2E_EXPECTED_APP_ID }}

      - name: Upload Slack test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slack-test-results
          path: |
            e2e/tui-test-results/
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
