name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm run test --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # Slack E2E — @slack tests skip gracefully if these aren't set
          SLACK_CLIENT_ID: ${{ secrets.SLACK_E2E_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_E2E_CLIENT_SECRET }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_E2E_APP_TOKEN }}
          SLACK_E2E_BOT_TOKEN: ${{ secrets.SLACK_E2E_BOT_TOKEN }}
          SLACK_E2E_USER_TOKEN: ${{ secrets.SLACK_E2E_USER_TOKEN }}
          SLACK_E2E_BOT_USER_ID: ${{ secrets.SLACK_E2E_BOT_USER_ID }}
          SLACK_E2E_TEAM_ID: ${{ secrets.SLACK_E2E_TEAM_ID }}
          SLACK_E2E_TEAM_NAME: ${{ secrets.SLACK_E2E_TEAM_NAME }}

      - name: Run TUI E2E tests
        run: npm run test:e2e:tui --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
