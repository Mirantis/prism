name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'e2e/**'
      - 'web/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The two suites sat at ~12 min before the bedrock-mantle specs, i.e. 3 min
    # of headroom against the old 15. The new specs measured ~30s together on a
    # fast run, but their waits are bounded far higher than that — real LLM
    # turns at 30-60s each put a slow-but-passing run several minutes above the
    # old baseline. Sized so the timeout catches hangs rather than occasionally
    # killing a slow green run; re-measure once this has a few runs behind it.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install npm 11.12.1
        run: npm install -g npm@11.12.1

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/sqlite/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E tests
        run: npm run test --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # Slack E2E — @slack tests skip gracefully if these aren't set
          SLACK_CLIENT_ID: ${{ secrets.SLACK_E2E_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_E2E_CLIENT_SECRET }}
          SLACK_APP_TOKEN: ${{ secrets.SLACK_E2E_APP_TOKEN }}
          SLACK_E2E_BOT_TOKEN: ${{ secrets.SLACK_E2E_BOT_TOKEN }}
          SLACK_E2E_USER_TOKEN: ${{ secrets.SLACK_E2E_USER_TOKEN }}
          SLACK_E2E_BOT_USER_ID: ${{ secrets.SLACK_E2E_BOT_USER_ID }}
          SLACK_E2E_TEAM_ID: ${{ secrets.SLACK_E2E_TEAM_ID }}
          SLACK_E2E_TEAM_NAME: ${{ secrets.SLACK_E2E_TEAM_NAME }}

      - name: Run TUI E2E tests
        # The two suites are independent, and a red Playwright step used to
        # skip this one — throwing away every TUI result for that run, which
        # is where most of the failures actually are. A later step running
        # does not mask the earlier failure: the job still ends up red.
        # `!cancelled()` rather than `always()` so cancelling a superseded run
        # doesn't keep the (per-token exclusive) Socket Mode connection held
        # for another ~9 minutes while its replacement boots.
        if: ${{ !cancelled() }}
        run: npm run test:e2e:tui --workspace=prism-agent-e2e
        env:
          CI: true
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # Slack — only the bedrock-mantle thread-classifier spec uses these,
          # and it skips itself when they are absent. Deliberately passed under
          # the SLACK_E2E_* names rather than SLACK_BOT_TOKEN: `setupRuntime`
          # spreads process.env into every runtime it boots, so the deployed
          # names would put every TUI spec's runtime on Socket Mode at once.
          # Runs after the Playwright step, so the two never hold the
          # (per-token exclusive) Socket Mode connection concurrently.
          SLACK_APP_TOKEN: ${{ secrets.SLACK_E2E_APP_TOKEN }}
          SLACK_E2E_BOT_TOKEN: ${{ secrets.SLACK_E2E_BOT_TOKEN }}
          SLACK_E2E_USER_TOKEN: ${{ secrets.SLACK_E2E_USER_TOKEN }}
          SLACK_E2E_BOT_USER_ID: ${{ secrets.SLACK_E2E_BOT_USER_ID }}
          SLACK_E2E_TEAM_ID: ${{ secrets.SLACK_E2E_TEAM_ID }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          # Playwright's traces/screenshots/videos + its JSON report, and the
          # TUI suite's JUnit report (a separate dir: Playwright wipes its own
          # outputDir when it starts, and it starts first).
          path: |
            e2e/test-results/
            e2e/tui-test-results/
          retention-days: 7
