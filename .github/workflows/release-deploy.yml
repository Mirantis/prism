name: Release Deploy

# Manual production build + push, gated by an environment approval.

on:
  workflow_dispatch:

permissions:
  contents: write # for `gh release create` (creates and pushes the tag)
  packages: write # for ghcr.io push

concurrency:
  group: release-deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
    steps:
      - name: Generate version and resolve release SHA marker
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Time-based version: vYYYY.M.DDHHMMSS (UTC). Seconds prevent
          # collisions between runs that land in the same minute.
          VERSION="v$(TZ=UTC date +'%Y.%-m.%-d%H%M%S')"
          RELEASE_SHA=$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Generated version: $VERSION"
          echo "Release SHA marker (main HEAD): $RELEASE_SHA"

  approve:
    needs: prepare
    environment: production
    runs-on: ubuntu-latest
    steps:
      - run: echo "Approved release ${{ needs.prepare.outputs.version }}"

  build-and-push:
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          GHCR_REPO: ghcr.io/lensapp/prism-agent
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '@lensapp:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\n' "${{ secrets.GITHUB_TOKEN }}" > .npmrc-secret
          docker build \
            --secret id=npmrc,src=.npmrc-secret \
            -t $GHCR_REPO:$VERSION \
            -t $GHCR_REPO:$IMAGE_TAG \
            -t $GHCR_REPO:latest \
            -f Dockerfile \
            .
          rm -f .npmrc-secret
          docker push $GHCR_REPO:$VERSION
          docker push $GHCR_REPO:$IMAGE_TAG
          docker push $GHCR_REPO:latest

  build-binaries:
    needs: [prepare, approve]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Pin to the same commit the docker image ships, so the archives
          # and the image are byte-equivalent.
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # SEA needs a released Node line; 22 matches scripts/build-sea.mjs.
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build:web

      - run: node scripts/build-sea.mjs prism
      - run: node scripts/build-sea.mjs prism-server
      - run: node scripts/collect-natives.mjs

      - run: node scripts/smoke-sea.mjs

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OS_ARCH=$(node -e 'process.stdout.write(`${process.platform}-${process.arch}`)')
          # Ship the installer inside the archive so users can run it directly.
          cp install.sh "dist-sea/$OS_ARCH/install.sh"
          cd dist-sea
          if [ "${{ runner.os }}" = "Windows" ]; then
            NAME="prism-$VERSION-$OS_ARCH.zip"
            7z a -tzip "../$NAME" "$OS_ARCH" >/dev/null
          else
            NAME="prism-$VERSION-$OS_ARCH.tar.gz"
            tar -czf "../$NAME" "$OS_ARCH"
          fi
          echo "Built: $NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            prism-*.tar.gz
            prism-*.zip
          if-no-files-found: error

  publish-release:
    needs: [prepare, build-and-push, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Flattens the three per-OS artifacts into one dir for the gh release glob.
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Prepend the deployed image identity to GitHub's auto-generated
          # release notes so the release page documents exactly what shipped.
          GENERATED=$(gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$VERSION" \
            -f target_commitish="$RELEASE_SHA" \
            --jq '.body')

          # printf rather than heredoc so backticks stay literal.
          {
            printf '## Deployed image\n\n'
            printf -- '- prism-agent: `%s`\n' "$BUILD_SHA"
            printf '\n---\n\n%s\n' "$GENERATED"
          } > /tmp/release-notes.md

          gh release create "$VERSION" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            artifacts/*
